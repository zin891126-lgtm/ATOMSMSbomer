name: Telegram Bot CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Run every 5 hours to keep the bot alive
    - cron: '0 */5 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: python3 -m pip install -r requirements.txt

    - name: Run bot
      timeout-minutes: 350 # Run for nearly 6 hours before the next scheduled restart
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: |
        while true; do
          python3 bot.py || echo "Bot crashed with exit code $?. Restarting..."
          sleep 5
        done
